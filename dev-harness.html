<!doctype html>
<!-- Dev-only harness. Mirrors the real page closely enough to test the button:
       - the remote screen painted into a <canvas> (what the live page does -
         one peer connection, zero track events, no <video>)
       - a 3008x2688 TWO-DIMENSIONAL composite: monitor 3 top-left, monitor 2
         top-right (portrait), monitor 1 bottom-left, with black gutters between.
         This is the layout that broke connected-component detection.
       - a fake right-hand control rail with ALL MONITORS / SINGLE MONITOR and a
         minimap, so native button injection can be verified
       - event logging on the canvas, to prove forwarded input arrives
     Not referenced by the manifest, so it is inert at runtime.
     NOTE: do not rename this with a leading underscore. Chrome reserves the "_"
     prefix and refuses to load an extension containing such a file at all. -->
<meta charset="utf-8">
<title>WRMM dev harness</title>

<script src="hook.js"></script>
<link rel="stylesheet" href="app.css">

<style>
  body { font: 13px/1.5 system-ui, sans-serif; background: #0b1016; color: #cfe0ee; margin: 0; display: flex; }
  #main { flex: 1 1 auto; padding: 12px; min-width: 0; }
  h1 { font-size: 14px; color: #7fd1ff; margin: 0 0 8px; }
  #screen { width: 100%; background: #000; border: 1px solid #22303d; display: block; }
  #status, #events { margin: 8px 0; font: 11px/1.5 ui-monospace, Consolas, monospace; color: #7f93a6; }
  #events { background: #060a0e; border: 1px solid #22303d; padding: 6px; min-height: 34px; white-space: pre-wrap; }
  .ok { color: #6ee7a0; } .bad { color: #ff8a8a; }

  #rail { flex: 0 0 250px; background: #1b2530; border-left: 1px solid #2b3a4a; padding: 12px; }
  #rail h2 { font-size: 11px; color: #8ba3b8; text-transform: uppercase; letter-spacing: .08em; margin: 0 0 8px; }
  .row { display: flex; margin-bottom: 6px; }
  .tgl { flex: 1 1 0; padding: 7px 6px; font: 600 10px/1.2 system-ui, sans-serif; letter-spacing: .05em;
         text-align: center; cursor: pointer; border: 1px solid #2f76a8; color: #cfe0ee;
         background: #223444; text-transform: uppercase; }
  .tgl.on { background: #1a8fd1; border-color: #1a8fd1; color: #fff; }
  #minimap { height: 120px; background: #0a0f14; border: 1px solid #2b3a4a; padding: 3px; }
  #minimap canvas { width: 100%; height: 100%; display: block; }
</style>

<div id="main">
  <h1>WRMM dev harness — canvas composite, 2D monitor layout</h1>
  <div id="status"></div>
  <div id="events">canvas events: (none yet)</div>
  <canvas id="screen"></canvas>
</div>

<div id="rail">
  <h2>Display</h2>
  <div class="row"><div class="tgl on">Fit Screen</div><div class="tgl">Original Size</div></div>
  <div class="row"><div class="tgl on">All Monitors</div><div class="tgl">Single Monitor</div></div>
  <div id="minimap"><canvas id="mini"></canvas></div>
</div>

<script>
  const status = document.getElementById('status');
  function say(msg, cls) {
    status.innerHTML += '<div class="' + (cls || '') + '">' + msg + '</div>';
    console.log('[harness] ' + msg);
  }

  // Mirrors the real endpoint: an L-shaped 2D arrangement needing both a vertical
  // and a horizontal cut. The seam width is the whole point - the live endpoint
  // packs monitors nearly edge to edge, which is what defeated a coarse grid.
  // ?gap=12 (default) reproduces that; ?gap=0 exercises the manual fallback.
  const GAP = (() => {
    const m = /[?&]gap=(\d+)/.exec(location.search);
    return m ? parseInt(m[1], 10) : 12;
  })();
  const MONITORS = [
    { name: 'MON 3', x: 0,           y: 0,           width: 1920, height: 1080 },
    { name: 'MON 2', x: 1920 + GAP,  y: 0,           width: 988,  height: 1600 },
    { name: 'MON 1', x: 0,           y: 1080 + GAP,  width: 1920, height: 1080 }
  ];
  const COMP_W = 1920 + GAP + 988;
  const COMP_H = Math.max(1600, 1080 + GAP + 1080);

  const screen = document.getElementById('screen');
  screen.width = COMP_W; screen.height = COMP_H;
  const ctx = screen.getContext('2d');
  const mini = document.getElementById('mini');
  mini.width = 400; mini.height = 340;
  const mctx = mini.getContext('2d');

  const COLOURS = ['#1f8f6f', '#4f3f9f', '#8f4f1f'];
  let frame = 0;

  function draw() {
    frame++;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, COMP_W, COMP_H);
    MONITORS.forEach((m, i) => {
      ctx.fillStyle = COLOURS[i];
      ctx.fillRect(m.x, m.y, m.width, m.height);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 130px monospace';
      ctx.fillText(m.name, m.x + 50, m.y + 150);
      ctx.font = '58px monospace';
      ctx.fillText(m.width + 'x' + m.height + ' @ ' + m.x + ',' + m.y, m.x + 50, m.y + 240);
      ctx.fillRect(m.x + 50 + ((frame * 8) % Math.max(1, m.width - 160)), m.y + m.height - 110, 80, 50);
    });

    mctx.fillStyle = '#000';
    mctx.fillRect(0, 0, mini.width, mini.height);
    const k = Math.min(mini.width / COMP_W, mini.height / COMP_H);
    MONITORS.forEach((m, i) => {
      mctx.fillStyle = COLOURS[i];
      mctx.fillRect(m.x * k, m.y * k, m.width * k, m.height * k);
    });
  }
  setInterval(draw, 80);
  draw();

  // Prove forwarded input lands on the render surface, and report it in
  // composite coordinates so the mapping can be checked.
  const evOut = document.getElementById('events');
  const seen = [];
  ['mousedown', 'mouseup', 'mousemove', 'wheel', 'contextmenu', 'pointerdown', 'keydown', 'keyup']
    .forEach(type => {
      screen.addEventListener(type, (ev) => {
        let detail = type;
        if (ev.clientX !== undefined && type !== 'keydown' && type !== 'keyup') {
          const r = screen.getBoundingClientRect();
          const cx = Math.round((ev.clientX - r.left) / r.width * COMP_W);
          const cy = Math.round((ev.clientY - r.top) / r.height * COMP_H);
          detail += ' @composite ' + cx + ',' + cy + (ev.isTrusted ? ' [trusted]' : ' [synthetic]');
        } else {
          detail += ' key=' + ev.key + ' code=' + ev.code + (ev.isTrusted ? ' [trusted]' : ' [synthetic]');
        }
        seen.push(detail);
        if (seen.length > 8) seen.shift();
        evOut.textContent = 'canvas events:\n' + seen.join('\n');
      });
    });
  window.__HARNESS_EVENTS__ = seen;

  document.querySelectorAll('.row').forEach(row => {
    row.querySelectorAll('.tgl').forEach(t => t.addEventListener('click', () => {
      row.querySelectorAll('.tgl').forEach(o => o.classList.remove('on'));
      t.classList.add('on');
    }));
  });

  (async () => {
    try {
      const pc1 = new RTCPeerConnection();
      const pc2 = new RTCPeerConnection();
      const dc = pc1.createDataChannel('wr-control');
      dc.onopen = () => dc.send(JSON.stringify({
        type: 'monitorLayout',
        monitors: MONITORS.map((m, i) => ({ index: i, x: m.x, y: m.y, width: m.width, height: m.height, isPrimary: i === 2 }))
      }));
      pc2.ondatachannel = (e) => { e.channel.onmessage = () => {}; };
      pc1.onicecandidate = (e) => e.candidate && pc2.addIceCandidate(e.candidate);
      pc2.onicecandidate = (e) => e.candidate && pc1.addIceCandidate(e.candidate);
      const offer = await pc1.createOffer();
      await pc1.setLocalDescription(offer);
      await pc2.setRemoteDescription(offer);
      const answer = await pc2.createAnswer();
      await pc2.setLocalDescription(answer);
      await pc1.setRemoteDescription(answer);
      say('data-channel-only loopback up (no media track — matches the real page)', 'ok');
    } catch (e) {
      say('loopback failed: ' + e, 'bad');
    }

    say('composite ' + COMP_W + 'x' + COMP_H + ' · expect 3 regions: '
      + MONITORS.map(m => m.width + 'x' + m.height + '@' + m.x + ',' + m.y).join('  '));

    const s = document.createElement('script');
    s.src = 'app.js';
    s.onload = () => say('app.js loaded', 'ok');
    document.body.appendChild(s);
  })();
</script>
